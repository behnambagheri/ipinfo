name: macOS app
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'macos/**'
      - 'packaging/**'
      - 'tests/macos/**'
      - 'scripts/package-macos.mjs'
      - 'public/brand/ipinfo.svg'
      - 'package*.json'
      - '.github/workflows/macos-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag and package version must match");'
      - run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: IPinfo-macOS
          path: |
            dist/macos/IPinfo-*-universal.zip
            dist/macos/SHA256SUMS
            dist/macos/ipinfo.rb
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IPinfo-macOS
          path: release/
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/IPinfo-*-universal.zip release/SHA256SUMS release/ipinfo.rb --verify-tag --title "IPinfo $GITHUB_REF_NAME for macOS" --notes-file macos/RELEASE_NOTES.md
