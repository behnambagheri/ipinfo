name: Desktop apps
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'macos/**'
      - 'desktop/**'
      - 'packaging/**'
      - 'tests/macos/**'
      - 'tests/desktop.test.mjs'
      - 'scripts/package-macos.mjs'
      - 'scripts/package-macos-ci.mjs'
      - 'scripts/package-desktop.mjs'
      - 'scripts/verify-desktop.mjs'
      - 'scripts/package-linux.mjs'
      - 'scripts/arch-package-metadata.mjs'
      - 'scripts/package-windows-manifests.mjs'
      - 'scripts/verify-linux-package.sh'
      - 'scripts/verify-windows-manifests.py'
      - 'public/brand/ipinfo.svg'
      - 'package*.json'
      - '.github/workflows/macos-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            artifact: linux-arm64
          - runner: windows-2022
            target: win32-x64
            artifact: windows-amd64
          - runner: windows-11-arm
            target: win32-arm64
            artifact: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag and package version must match");'
      - run: npm run test:desktop
      - run: npm run package:desktop -- ${{ matrix.target }}
      - name: Build Debian, RPM, and Arch packages
        if: runner.os == 'Linux'
        run: npm run package:linux -- ${{ matrix.target }}
      - name: Verify native Debian package installation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo bash scripts/verify-linux-package.sh deb "$PWD/$(find dist/desktop/${{ matrix.artifact }} -maxdepth 1 -name '*.deb' -print -quit)"
      - name: Verify native RPM package installation
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist/desktop/${{ matrix.artifact }}:/packages:ro" -v "$PWD/scripts/verify-linux-package.sh:/verify.sh:ro" rockylinux:9 bash -c 'bash /verify.sh rpm "$(find /packages -maxdepth 1 -name "*.rpm" -print -quit)"'
      - name: Verify native Arch package installation
        if: matrix.target == 'linux-x64'
        run: |
          docker run --rm -v "$PWD/dist/desktop/${{ matrix.artifact }}:/packages:ro" -v "$PWD/scripts/verify-linux-package.sh:/verify.sh:ro" archlinux:base bash -c 'bash /verify.sh archlinux "$(find /packages -maxdepth 1 -name "*.pkg.tar.zst" -print -quit)"'
      - name: Test Linux graphical and standalone command-line executables
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnss3 libasound2t64 libgbm1
          sudo chown root:root dist/desktop/${{ matrix.artifact }}/IPinfo-*/chrome-sandbox
          sudo chmod 4755 dist/desktop/${{ matrix.artifact }}/IPinfo-*/chrome-sandbox
          xvfb-run -a npm run verify:desktop
      - name: Test Windows graphical and standalone command-line executables
        if: runner.os == 'Windows'
        run: npm run verify:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: IPinfo-${{ matrix.artifact }}
          compression-level: 0
          path: |
            dist/desktop/${{ matrix.artifact }}/IPinfo-*.zip
            dist/desktop/${{ matrix.artifact }}/IPinfo-*.tar.gz
            dist/desktop/${{ matrix.artifact }}/bea-ipinfo_*.deb
            dist/desktop/${{ matrix.artifact }}/bea-ipinfo-*.rpm
            dist/desktop/${{ matrix.artifact }}/bea-ipinfo-*.pkg.tar.zst
            dist/desktop/${{ matrix.artifact }}/SHA256SUMS-*
          if-no-files-found: error
  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag and package version must match");'
      - name: Build and test pull requests without signing credentials
        if: github.event_name == 'pull_request'
        run: npm run package:macos
      - name: Build release with optional Developer ID signing and notarization
        if: github.event_name != 'pull_request'
        run: node scripts/package-macos-ci.mjs
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: IPinfo-macOS
          path: |
            dist/macos/IPinfo-*-universal.zip
            dist/macos/IPinfo-*-universal.dmg
            dist/macos/IPinfo-*-arm64.zip
            dist/macos/IPinfo-*-arm64.dmg
            dist/macos/SHA256SUMS
            dist/macos/ipinfo.rb
            dist/macos/distribution-status.json
          if-no-files-found: error
  manifests:
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: IPinfo-windows-*
          path: release/desktop/
          merge-multiple: true
      - name: Generate and validate Windows package-manager manifests
        run: |
          node scripts/package-windows-manifests.mjs --assets release/desktop --output release/package-managers
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml python3-jsonschema
          /usr/bin/python3 scripts/verify-windows-manifests.py --assets release/desktop --manifests release/package-managers
          (cd release/package-managers/winget && zip -r ../IPinfo-winget-manifests.zip manifests)
          (cd release/package-managers && sha256sum ipinfo.json IPinfo-winget-manifests.zip > SHA256SUMS-manifests)
      - uses: actions/upload-artifact@v4
        with:
          name: IPinfo-package-managers
          path: |
            release/package-managers/ipinfo.json
            release/package-managers/IPinfo-winget-manifests.zip
            release/package-managers/SHA256SUMS-manifests
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, desktop, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: IPinfo-macOS
          path: release/macos/
      - uses: actions/download-artifact@v4
        with:
          pattern: IPinfo-linux-*
          path: release/desktop/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: IPinfo-windows-*
          path: release/desktop/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: IPinfo-package-managers
          path: release/package-managers/
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/RELEASE_NOTES.md release/notes.md
          cat release/macos/SHA256SUMS release/desktop/SHA256SUMS-* release/package-managers/SHA256SUMS-manifests > release/SHA256SUMS
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const status = JSON.parse(readFileSync("release/macos/distribution-status.json")); appendFileSync("release/notes.md", `\nmacOS signing: ${status.developer_id_signed ? "Developer ID signed" : "ad-hoc signed"}; ${status.notarized ? "Apple-notarized" : "not Apple-notarized; first launch may require approval in Privacy & Security"}.\n`);'
          (cd release/macos && sha256sum -c SHA256SUMS)
          (cd release/desktop && cat SHA256SUMS-* | sha256sum -c -)
          (cd release/package-managers && sha256sum -c SHA256SUMS-manifests)
          gh release create "$GITHUB_REF_NAME" release/macos/IPinfo-*-universal.zip release/macos/IPinfo-*-universal.dmg release/macos/IPinfo-*-arm64.zip release/macos/IPinfo-*-arm64.dmg release/desktop/IPinfo-*.zip release/desktop/IPinfo-*.tar.gz release/desktop/bea-ipinfo_*.deb release/desktop/bea-ipinfo-*.rpm release/desktop/bea-ipinfo-*.pkg.tar.zst release/package-managers/ipinfo.json release/package-managers/IPinfo-winget-manifests.zip release/SHA256SUMS release/macos/ipinfo.rb release/macos/distribution-status.json --verify-tag --title "IPinfo $GITHUB_REF_NAME" --notes-file release/notes.md
