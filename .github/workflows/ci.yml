name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Let publishing and deployment finish; supersede only pull request checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch and verify the latest GeoLite2 release
        id: geolite2
        run: node scripts/prepare-geolite2.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Compare database range lookups with the reference MMDB reader
        run: node scripts/verify-geolite2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: geolite2
          path: |
            dist/geolite2/manifest.json
            dist/geolite2-assets/
          retention-days: 1
      - name: Check shell syntax
        run: sh -n scripts/download-geolite2.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: helm lint charts/ipinfo --strict
      - run: helm template ipinfo charts/ipinfo --set ingress.enabled=true > /tmp/ipinfo.yaml
  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipinfo:test
          build-args: BUILD_REVISION=${{ github.sha }}
          no-cache-filters: geolite2
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: bash scripts/smoke-container.sh ipinfo:test
  publish:
    if: github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache-filters: geolite2
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Package Helm chart
        run: helm package charts/ipinfo --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/ipinfo-*.tgz
  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: geolite2
          path: dist/
      - name: Select the verified database release
        id: geolite2
        run: |
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const { release } = JSON.parse(readFileSync("dist/geolite2/manifest.json", "utf8")); appendFileSync(process.env.GITHUB_OUTPUT, `release=${release}\n`);'
      - name: Deploy to ip.bea.sh
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          command: deploy --var BUILD_REVISION:${{ github.sha }} --var GEOIP_RELEASE:${{ steps.geolite2.outputs.release }}
      - name: Verify the deployed revision
        run: node scripts/verify-worker.mjs
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_GEOIP_RELEASE: ${{ steps.geolite2.outputs.release }}
