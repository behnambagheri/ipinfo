name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check shell syntax
        run: sh -n scripts/entrypoint.sh scripts/download-geolite2.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: helm lint charts/ipinfo --strict
      - run: helm template ipinfo charts/ipinfo --set ingress.enabled=true > /tmp/ipinfo.yaml
  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipinfo:test
          no-cache-filters: geolite2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: bash scripts/smoke-container.sh ipinfo:test
  publish:
    if: github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache-filters: geolite2
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Package Helm chart
        run: helm package charts/ipinfo --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/ipinfo-*.tgz
