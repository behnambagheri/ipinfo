<script>
  (() => {
    // Shared with bea.sh: no saved choice follows the OS; a saved light or dark choice is forced.
    try {
      const saved = localStorage.getItem("bb-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {
      // Follow the OS theme when browser storage is unavailable.
    }
  })();
</script>
