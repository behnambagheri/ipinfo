<script>
  (() => {
    let preference = "system";
    try {
      const saved = localStorage.getItem("ipinfo-theme");
      if (["system", "light", "dark"].includes(saved)) preference = saved;
    } catch {
      // Keep system mode when browser storage is unavailable.
    }
    const dark = preference === "dark" ||
      (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.themePreference = preference;
    document.documentElement.dataset.theme = dark ? "bea-dark" : "bea";
  })();
</script>
