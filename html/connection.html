<script>
  (() => {
    "use strict";
    const address = document.getElementById("ip-address");
    const ip = address.dataset.ip;
    if (ip.includes(":")) {
      // Keep each hextet intact and prefer wrapping after a colon or double colon.
      address.replaceChildren(...ip.split(/(:{1,2})/).flatMap((part) => {
        const text = document.createTextNode(part);
        return /^:{1,2}$/.test(part) ? [text, document.createElement("wbr")] : [text];
      }));
    }

    const controls = document.getElementById("family-controls");
    const buttons = [...controls.querySelectorAll("button[data-ip-family]")];
    const status = document.getElementById("family-status");
    const currentURL = new URL(window.location.href);
    const selected = currentURL.searchParams.has("ip") ? currentURL.searchParams.get("family") : "auto";
    const ipv4 = /^(?:\d{1,3}\.){3}\d{1,3}$/;
    const ipv6 = /^[\da-f:]+$/i;
    const matchesFamily = (value, family) => typeof value === "string" && (family === "4"
      ? ipv4.test(value) && value.split(".").every((part) => Number(part) <= 255)
      : ipv6.test(value) && value.includes(":"));
    const activeFamily = ["4", "6"].includes(selected) && matchesFamily(ip, selected) ? selected : selected === "auto" ? "auto" : null;
    buttons.forEach((button) => {
      const active = button.dataset.ipFamily === activeFamily;
      button.setAttribute("aria-pressed", String(active));
      button.classList.toggle("btn-active", active);
    });
    if (activeFamily && activeFamily !== "auto") {
      document.getElementById("ip-title").textContent = `Your IPv${activeFamily} address`;
      status.textContent = `IPv${activeFamily} detected via ipify. Select Auto to return to your current connection.`;
    }
    controls.classList.replace("hidden", "flex");

    let pending;
    buttons.forEach((button) => button.addEventListener("click", async () => {
      const family = button.dataset.ipFamily;
      pending?.abort();
      if (family === "auto") {
        window.location.assign(new URL("/", currentURL.origin).href);
        return;
      }
      const controller = new AbortController();
      pending = controller;
      const timeout = setTimeout(() => controller.abort(), 8000);
      buttons.forEach((item) => { item.disabled = item.dataset.ipFamily !== "auto"; });
      controls.setAttribute("aria-busy", "true");
      status.textContent = `Detecting your IPv${family} address…`;
      try {
        const endpoint = family === "4" ? "https://api.ipify.org?format=json" : "https://api6.ipify.org?format=json";
        const response = await fetch(endpoint, { signal: controller.signal, credentials: "omit", cache: "no-store", redirect: "error", referrerPolicy: "no-referrer" });
        if (!response.ok) throw new Error("Detection service unavailable");
        const result = await response.json();
        if (!matchesFamily(result.ip, family)) throw new Error("Unexpected address version");
        if (controller.signal.aborted) return;
        const target = new URL("/", currentURL.origin);
        target.searchParams.set("ip", result.ip);
        target.searchParams.set("family", family);
        window.location.assign(target.href);
      } catch {
        if (pending === controller) status.textContent = `Could not detect your IPv${family} address. Your network may not support IPv${family}, or ipify could not be reached. Auto is still available.`;
      } finally {
        clearTimeout(timeout);
        if (pending === controller) {
          pending = undefined;
          buttons.forEach((item) => { item.disabled = false; });
          controls.setAttribute("aria-busy", "false");
        }
      }
    }));
  })();
</script>
