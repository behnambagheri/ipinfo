<dialog id="install-dialog" class="dialog" aria-labelledby="install-title">
  <div class="dialog-box dialog-box--narrow">
    <div class="row">
      <img src="/brand/ipinfo.svg" width="48" height="48" alt="" class="app-icon" />
      <div><h2 id="install-title">Install IPinfo</h2><p class="muted small">Your network, one tap away.</p></div>
    </div>
    <p id="install-instructions" class="small">Use your browser’s menu to install IPinfo or add it to your home screen. In Safari on iPhone or iPad, tap Share, then Add to Home Screen. On Mac, choose File → Add to Dock.</p>
    <p class="muted fine">IP and location checks need an internet connection.</p>
    <div class="dialog-actions"><form method="dialog"><button class="bb-button bb-button--primary bb-button--sm">Got it</button></form></div>
  </div>
  <form method="dialog" class="dialog-backdrop"><button aria-label="Close install instructions">Close</button></form>
</dialog>
<script>
  (() => {
    "use strict";
    const buttons = document.querySelectorAll("[data-install-app]");
    const dialog = document.getElementById("install-dialog");
    const standalone = matchMedia("(display-mode: standalone)");
    let installPrompt;
    let installed = false;

    function updateButton() {
      buttons.forEach(button => button.classList.toggle("hidden", installed || standalone.matches || navigator.standalone === true || !window.isSecureContext));
    }
    updateButton();
    standalone.addEventListener("change", updateButton);

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      updateButton();
    });
    window.addEventListener("appinstalled", () => {
      installed = true;
      installPrompt = undefined;
      dialog.close();
      updateButton();
    });

    buttons.forEach(button => button.addEventListener("click", async () => {
      if (!installPrompt) {
        dialog.showModal();
        return;
      }
      const prompt = installPrompt;
      installPrompt = undefined;
      buttons.forEach(button => { button.disabled = true; });
      try {
        await prompt.prompt();
        await prompt.userChoice;
      } catch {
        dialog.showModal();
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }));

    if ("serviceWorker" in navigator && window.isSecureContext) {
      navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" }).catch(() => {
        // Browsing still works when storage or service workers are blocked.
      });
    }
  })();
</script>
