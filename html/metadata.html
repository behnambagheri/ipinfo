<script>
  (() => {
    "use strict";
    const section = document.getElementById("database-updates");
    async function loadDates() {
      try {
        const response = await fetch(new URL("/database-info", window.location.origin), {
          signal: AbortSignal.timeout(4000), cache: "no-store", redirect: "error",
          headers: { Accept: "application/json" },
        });
        if (!response.ok) return;
        const info = await response.json();
        const local = window.IPinfoTime;
        const dates = [];
        section.querySelectorAll("time[data-database]").forEach((element) => {
          const value = info.databases?.[element.dataset.database];
          const date = new Date(value || "");
          if (!Number.isFinite(date.getTime())) return;
          element.dateTime = date.toISOString();
          element.textContent = local.date(date);
          element.title = `Database built ${local.timestamp(date)}`;
          dates.push({ name: element.dataset.database, date });
        });
        if (dates.length === 3 && new Set(dates.map(({ date }) => local.dateKey(date))).size === 1) {
          const shared = section.querySelector("time[data-database-shared]");
          shared.dateTime = dates[0].date.toISOString();
          shared.textContent = local.date(dates[0].date);
          shared.title = dates.map(({ name, date }) => `${name}: ${local.timestamp(date)}`).join("\n");
          section.querySelector("[data-database-details]").classList.add("hidden");
          section.querySelector("[data-database-common]").classList.remove("hidden");
        }
        const updated = new Date(info.updates?.last_successful_update || "");
        if (Number.isFinite(updated.getTime())) {
          const time = section.querySelector("time[data-database-success-time]");
          time.dateTime = updated.toISOString();
          time.textContent = local.timestamp(updated);
          time.title = `Your time zone: ${local.zone}`;
          section.querySelector("[data-database-success]").classList.remove("hidden");
        }
        if (dates.length > 0 || Number.isFinite(updated.getTime())) section.classList.remove("hidden");
      } catch {
        // Metadata failure must not interfere with IP lookup or page interactions.
      }
    }
    loadDates();
  })();
</script>
