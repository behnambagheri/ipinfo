{{- $network := .Values.network | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ipinfo.fullname" . }}
  labels:
    {{- include "ipinfo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ipinfo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ipinfo.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ipinfo
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ECHOIP_LISTEN
              value: ":8080"
            - name: ECHOIP_TRUSTED_HEADERS
              value: {{ .Values.trustedHeaders | quote }}
            - name: ECHOIP_CACHE_SIZE
              value: {{ .Values.cacheSize | quote }}
            - name: ECHOIP_PORT_LOOKUP
              value: {{ .Values.portLookup | quote }}
            - name: ECHOIP_REVERSE_LOOKUP
              value: {{ .Values.reverseLookup | quote }}
            - name: IPINFO_AUTO_URL
              value: {{ $network.autoURL | default "" | quote }}
            - name: IPINFO_IPV4_URL
              value: {{ $network.ipv4URL | default "" | quote }}
            - name: IPINFO_IPV6_URL
              value: {{ $network.ipv6URL | default "" | quote }}
            - name: IPINFO_REQUIRED_FAMILY
              value: {{ $network.requiredFamily | default "" | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
