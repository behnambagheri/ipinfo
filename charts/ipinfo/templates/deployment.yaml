{{- $updates := include "ipinfo.databaseUpdates" . | fromJson }}
{{- $stats := .Values.statistics | default dict }}
{{- $statsStorage := $stats.persistence | default dict }}
{{- if and $stats.enabled (not $stats.existingSecret) }}
{{- fail "statistics.enabled requires statistics.existingSecret" }}
{{- end }}
{{- if and $updates.existingClaim (ne (int .Values.replicaCount) 1) }}
{{- fail "databaseUpdates.existingClaim requires replicaCount=1; update directories must not be shared by concurrent writers" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ipinfo.fullname" . }}
  labels:
    {{- include "ipinfo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ipinfo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ipinfo.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ipinfo
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: IPINFO_LISTEN
              value: ":8080"
            - name: IPINFO_TRUSTED_HEADERS
              value: {{ .Values.trustedHeaders | quote }}
            - name: IPINFO_CACHE_SIZE
              value: {{ .Values.cacheSize | quote }}
            - name: IPINFO_PORT_LOOKUP
              value: {{ .Values.portLookup | quote }}
            - name: IPINFO_REVERSE_LOOKUP
              value: {{ .Values.reverseLookup | quote }}
            - name: IPINFO_DATABASE_UPDATE_CONFIG
              value: /etc/ipinfo/updates.json
            - name: IPINFO_DATABASE_UPDATE_DIR
              value: /var/lib/ipinfo/geolite2
            {{- if $stats.enabled }}
            - name: IPINFO_STATS_ENDPOINT
              value: {{ $stats.endpoint | quote }}
            - name: IPINFO_STATS_DIR
              value: /var/lib/ipinfo/statistics
            - name: IPINFO_VISITOR_STATS_ENABLED
              value: {{ $stats.visitorIPs | default false | quote }}
            - name: IPINFO_STATS_PROXY
              {{- if ($stats.proxySecret | default dict).name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $stats.proxySecret.name | quote }}
                  key: {{ $stats.proxySecret.key | default "proxy" | quote }}
              {{- else }}
              value: {{ $stats.proxy | default "" | quote }}
              {{- end }}
            - name: IPINFO_STATS_REPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $stats.existingSecret | quote }}
                  key: {{ $stats.secretKey | default "token" | quote }}
            {{- end }}
            {{- if $updates.proxySecret.name }}
            - name: IPINFO_DATABASE_UPDATE_PROXY
              valueFrom:
                secretKeyRef:
                  name: {{ $updates.proxySecret.name | quote }}
                  key: {{ $updates.proxySecret.key | quote }}
            {{- end }}
          volumeMounts:
            - name: database-update-settings
              mountPath: /etc/ipinfo
              readOnly: true
            - name: database-updates
              mountPath: /var/lib/ipinfo/geolite2
            {{- if $stats.enabled }}
            - name: statistics
              mountPath: /var/lib/ipinfo/statistics
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if $stats.enabled }}
        - name: statistics
          {{- if or $statsStorage.enabled $statsStorage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $statsStorage.existingClaim | default (printf "%s-statistics" (include "ipinfo.fullname" .)) | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $statsStorage.size | default "1Gi" | quote }}
          {{- end }}
        {{- end }}
        - name: database-update-settings
          configMap:
            name: {{ default (printf "%s-database-updates" (include "ipinfo.fullname" .)) $updates.existingConfigMap }}
        - name: database-updates
          {{- if $updates.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $updates.existingClaim | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $updates.storageSize | quote }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
