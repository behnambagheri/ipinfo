replicaCount: 2
image:
  repository: ghcr.io/behnambagheri/ipinfo
  tag: latest
  digest: ""
  pullPolicy: Always
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ipinfo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
# Empty by default: only trust headers overwritten by your own ingress/proxy.
trustedHeaders: ""
cacheSize: 0
portLookup: false
reverseLookup: true
statistics:
  enabled: false
  # Private source-IP counts, retained for 30 reporting days.
  visitorIPs: false
  endpoint: https://ip.bea.sh/internal/usage
  # The Secret contains the reporting token, never a Cloudflare account API token.
  existingSecret: ""
  secretKey: token
  # Optional egress proxy for statistics only. Store credentials in a Secret.
  proxy: ""
  proxySecret:
    name: ""
    key: proxy
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 1Gi
databaseUpdates:
  enabled: true
  interval: "168h"
  proxy: ""
  existingConfigMap: ""
  proxySecret:
    name: ""
    key: proxy
  storageSize: 1Gi
  # Optional durable storage. A shared update directory requires one replica.
  existingClaim: ""
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
